name: release-please

# Opens or updates a release pull request when commits reach main.
# Merging that pull request creates the tag and the GitHub release.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/config/release/release-please.config.json
          manifest-file: .github/config/release/release-please-manifest.json
